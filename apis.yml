aid: portswigger
name: PortSwigger
description: PortSwigger is the UK-based security research company behind Burp Suite,
  the industry-standard web and API security testing platform used by penetration
  testers and enterprise AppSec teams worldwide. The platform is available as Burp
  Suite Community Edition (free), Burp Suite Professional (manual testing toolkit),
  and Burp Suite DAST (enterprise dynamic application security testing). Developers
  can automate and integrate with Burp Suite DAST via a GraphQL API and a REST API,
  both secured with API key authentication. PortSwigger also provides the Montoya
  extension API for building custom Burp Suite extensions and an official MCP Server
  extension that bridges Burp Suite with AI clients such as Claude Desktop.
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Security
- Web Security
- Penetration Testing
- DAST
- API Security
- Developer Tools
