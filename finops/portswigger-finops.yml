focusColumns:
  ServiceName: PortSwigger Burp Suite
  ServiceCategory: Security
  ProviderName: PortSwigger
  PublisherName: PortSwigger
  BillingCurrency: USD
meters:
  - name: Scan Hours
    unit: hours
    aggregation: sum
    description: >-
      Number of scanning hours consumed in the PAYS (Pay-as-you-scan) model.
      Billed per minute, rounded to the nearest cent. Default cap of 500 hours
      per month.

  - name: User Licenses
    unit: user-years
    aggregation: sum
    description: >-
      Number of Burp Suite Professional user licenses purchased. Each user
      requires an individual annual subscription.

  - name: DAST Enterprise Seats
    unit: enterprise-instance
    aggregation: max
    description: >-
      Enterprise DAST subscriptions are priced per instance/deployment with
      unlimited users. Cost determined by deployment size and scan volume,
      quoted by PortSwigger sales.
principles:
  - name: Visibility
    description: >-
      Track Burp Suite DAST scan hours monthly via the PAYS billing dashboard.
      Monitor user license utilization across Professional seats to identify
      unused licenses.
  - name: Optimization
    description: >-
      Right-size scan hour caps to avoid overage billing. Consolidate Professional
      licenses where users share testing scope. Evaluate multi-year license
      discounts (10-25% savings common) for stable team sizes.
  - name: Allocation
    description: >-
      Tag scan configurations by team or project in Burp Suite DAST to allocate
      scan costs to engineering teams or application portfolios for chargeback
      or showback reporting.
